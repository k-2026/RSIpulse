name: Stock Check

on:
  schedule:
    # 14:40 JST = 05:40 UTC、平日のみ
    - cron: "40 5 * * 1-5"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "true にすると銘柄チェックはせず、テスト通知だけを送信します"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock check
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          TEST_NOTIFICATION: ${{ github.event.inputs.test_notification }}
        run: python check_stocks.py

      - name: Commit status.json
        run: |
          git config user.name "stock-alert-bot"
          git config user.email "actions@github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "update status.json [skip ci]"
          git push
