name: Stock Check

on:
  schedule:
    - cron: "40 5 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock check
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python check_stocks.py

      - name: Commit status.json
        run: |
          git config user.name "stock-alert-bot"
          git config user.email "actions@github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "update status.json [skip ci]"
          git push
